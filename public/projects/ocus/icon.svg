<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ocus-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ocus-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="ocus-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="14" fill="url(#ocus-bg)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Background decorative concentric rings -->
  <circle cx="32" cy="32" r="22" stroke="#10B981" stroke-opacity="0.1" stroke-width="1" fill="none" />
  <circle cx="32" cy="32" r="15" stroke="#10B981" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="2 3" fill="none" />

  <!-- Iconic Ocus Eye Motif -->
  <g filter="url(#ocus-glow)">
    <!-- Eye Contour -->
    <path d="M12 32 C17 21, 47 21, 52 32 C47 43, 17 43, 12 32 Z" 
          fill="none" 
          stroke="url(#ocus-stroke)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Center Iris / Pupil -->
    <circle cx="32" cy="32" r="6" fill="#10B981" />
    <circle cx="34" cy="30" r="1.8" fill="#F8FAFC" />
  </g>
</svg>
