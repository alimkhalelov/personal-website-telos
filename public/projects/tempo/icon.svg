<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tempo-brand-squircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Full Canvas Background Gradient filling entire squircle -->
  <rect width="64" height="64" rx="14" fill="url(#tempo-brand-squircle)" />

  <!-- Kinetic Runner Silhouette -->
  <g stroke="#07080d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="38" cy="13" r="4.5" fill="#07080d" stroke="none" />
    <!-- Rear Arm -->
    <polyline points="34,20 26,25 29,32" stroke-width="4" />
    <!-- Rear Leg -->
    <polyline points="28,34 20,45 12,53" stroke-width="4.5" />
    <!-- Torso -->
    <line x1="35" y1="19" x2="28" y2="34" stroke-width="5" />
    <!-- Front Leg -->
    <polyline points="28,34 38,42 35,54" stroke-width="4.5" />
    <!-- Front Arm -->
    <polyline points="34,20 41,27 47,22" stroke-width="4" />
  </g>
</svg>
