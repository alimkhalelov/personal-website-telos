<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="portal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="portal-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="portal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="14" fill="url(#portal-bg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Network / Topology graph overlay -->
  <g stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.2">
    <line x1="16" y1="20" x2="32" y2="32" />
    <line x1="48" y1="20" x2="32" y2="32" />
    <line x1="32" y1="32" x2="20" y2="48" />
    <line x1="32" y1="32" x2="44" y2="48" />
  </g>

  <!-- Topology Node Dots -->
  <circle cx="16" cy="20" r="2.5" fill="#38bdf8" />
  <circle cx="48" cy="20" r="2.5" fill="#38bdf8" />
  <circle cx="20" cy="48" r="2.5" fill="#10b981" />
  <circle cx="44" cy="48" r="2.5" fill="#10b981" />

  <!-- Central Ocus Eye Portal Motif -->
  <g filter="url(#portal-glow)">
    <path d="M14 32 C19 23, 45 23, 50 32 C45 41, 19 41, 14 32 Z" 
          fill="none" 
          stroke="url(#portal-accent)" 
          stroke-width="2.8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <circle cx="32" cy="32" r="5.5" fill="#38bdf8" />
    <circle cx="33.5" cy="30.5" r="1.5" fill="#FFFFFF" />
  </g>
</svg>
