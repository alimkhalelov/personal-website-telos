<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title3D">
  <title id="title3D">Остаточный интеллект — Concept 2: 3D Axonometric Monogram (opc-skills)</title>
  <rect width="256" height="256" fill="#0A0C10" rx="32"/>
  
  <g id="axonometric_3d">
    <!-- Letter 'O' 3D Extrusions (Dark Steel #2E3A52) -->
    <polygon points="112,96 136,72 136,168 112,192" fill="#2E3A52"/>
    <polygon points="48,96 72,72 136,72 112,96" fill="#2E3A52"/>

    <!-- Letter 'O' Front Face (White, with inner cutout) -->
    <path fill="#FFFFFF" fill-rule="evenodd" d="
      M 48 96
      H 112
      V 192
      H 48
      Z
      M 72 120
      H 88
      V 168
      H 72
      Z
    "/>

    <!-- Letter 'И' 3D Extrusions (Dark Steel #2E3A52) -->
    <polygon points="144,96 168,72 192,72 168,96" fill="#2E3A52"/>
    <polygon points="184,96 208,72 232,72 208,96" fill="#2E3A52"/>
    <polygon points="208,96 232,72 232,168 208,192" fill="#2E3A52"/>

    <!-- Letter 'И' Front Face (White) -->
    <path fill="#FFFFFF" d="
      M 144 96
      H 168
      V 144
      L 184 128
      V 96
      H 208
      V 192
      H 184
      V 144
      L 168 160
      V 192
      H 144
      Z
    "/>

    <!-- Floating 3D Diacritic Spark (The 'Кратка' over И as a floating 3D cube) -->
    <rect x="180" y="44" width="20" height="20" fill="#FF5500" rx="2"/>
    <polygon points="180,44 192,32 212,32 200,44" fill="#FFB700"/>
    <polygon points="200,44 212,32 212,52 200,64" fill="#FF5500"/>
  </g>
</svg>
