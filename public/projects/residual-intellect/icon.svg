<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#A6E600"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Outer Cybernetic Border -->
  <rect x="8" y="8" width="104" height="104" rx="22" fill="none" stroke="#000000" stroke-width="6"/>
  
  <!-- Cyberpunk Crosshair Grid Markers -->
  <circle cx="20" cy="20" r="2.5" fill="#000000"/>
  <circle cx="100" cy="20" r="2.5" fill="#000000"/>
  <circle cx="20" cy="100" r="2.5" fill="#000000"/>
  <circle cx="100" cy="100" r="2.5" fill="#000000"/>
  
  <!-- Monogram ОИ -->
  <text x="60" y="74" text-anchor="middle" font-family="'Impact', 'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="-1" fill="#000000">ОИ</text>
  
  <!-- Sub-label in micro font -->
  <text x="60" y="94" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="9" letter-spacing="2" fill="#000000">RESIDUAL</text>
</svg>
